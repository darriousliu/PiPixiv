name: 功能建议 / Feature request
description: 建议新功能或改进现有体验。 Suggest a new feature or an improvement.
title: "[Feature Request] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交前请检查是否已有相同建议。 Please check for duplicate requests before submitting.
        [搜索已有 Issue / Search existing issues](https://github.com/darriousliu/PiPixiv/issues?q=is%3Aissue)

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Use case
      description: 你想完成什么？目前遇到了什么困难？ What are you trying to do, and what makes it difficult today?
    validations:
      required: true

  - type: textarea
    id: desired-behavior
    attributes:
      label: 期望的改进 / Desired improvement
      description: 描述你希望 PiPixiv 如何支持这个场景。 Describe how you would like PiPixiv to support this use case.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息 / Additional context
      description: 可附上适用平台、现有替代方案、参考链接或示意图。 You can include affected platforms, current workarounds, reference links, or mockups.
